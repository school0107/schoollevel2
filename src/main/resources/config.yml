# =====================================================
#  SchoolLevel2 - Configuration
#  Dùng mã màu legacy: &a &b &c &e &6 &l &o ...
# =====================================================

settings:
  max-level: 200
  points-per-level: 2
  start-level: 1
  # 2 ticks = 0.1s. Actionbar gửi liên tục không bao giờ bị đè
  actionbar-interval-ticks: 2
  save-interval-seconds: 300
  auto-save-on-quit: true
  debug-mining: false

  show-actionbar: true
  show-level-bar: true
  show-title-on-levelup: true
  show-chat-on-levelup: true

exp-formula:
  base: 100
  exponent: 1.5

mining-exp:
  COAL_ORE: 5
  DEEPSLATE_COAL_ORE: 5
  IRON_ORE: 10
  DEEPSLATE_IRON_ORE: 10
  COPPER_ORE: 8
  DEEPSLATE_COPPER_ORE: 8
  GOLD_ORE: 15
  DEEPSLATE_GOLD_ORE: 15
  REDSTONE_ORE: 12
  DEEPSLATE_REDSTONE_ORE: 12
  LAPIS_ORE: 18
  DEEPSLATE_LAPIS_ORE: 18
  DIAMOND_ORE: 40
  DEEPSLATE_DIAMOND_ORE: 40
  EMERALD_ORE: 60
  DEEPSLATE_EMERALD_ORE: 60
  NETHER_GOLD_ORE: 20
  NETHER_QUARTZ_ORE: 15
  ANCIENT_DEBRIS: 150

stats:
  melee:
    per-point: 1.0
    max-points: 100
  ranged:
    per-point: 1.0
    max-points: 100
  health:
    per-point: 2.0
    max-points: 50
  agility:
    speed-per-point: 1.0
    dodge-per-point: 0.25
    max-points: 20
    dodge-chance-cap: 5.0
    speed-effect-step: 20.0
  chakra:
    max-points: 50
    crit-chance-per-point: 0.5
    crit-chance-cap: 25.0
    crit-damage-multiplier: 1.5
    health-per-point: 1.0
    speed-per-point: 0.3
    dodge-per-point: 0.1

reset-item:
  material: NETHER_STAR
  name: "&c&l✦ RESET STATS ✦"
  lore:
    - "&7Chuột phải để reset toàn bộ chỉ số."
    - "&c⚠ Sẽ hoàn trả toàn bộ điểm tiềm năng!"
    - ""
    - "&e▶ Click phải để sử dụng"
  refund-points: true

menu:
  title: "&b&l✦ TIỀM NĂNG ✦"
  rows: 6
  filler-material: GRAY_STAINED_GLASS_PANE

# Cấu hình hệ thống ép đồ RPG
rpg-item:
  level-required-msg: "&c✖ Bạn cần đạt Level &e{level}&c để sử dụng vật phẩm này!"
  drop-on-death: true
  prevent-unequip-on-low-level: true
  lore-format:
    melee: "&c ⚔ Sát thương cận chiến: &f+{value}"
    ranged: "&a 🏹 Sát thương tầm xa: &f+{value}"
    health: "&4 ❤ Máu tối đa: &f+{value}"
    agility: "&b 💨 Nhanh nhẹn: &f+{value}"
    chakra: "&d 🔥 Chakra: &f+{value}"
    crit: "&6 💥 Tỉ lệ chí mạng: &f+{value}%"
  level-lore-format: "&c✖ Yêu cầu: &eLevel {level}"

messages:
  prefix: "&b[&dSchoolLevel2&b] &r"
  no-permission: "&c✖ Bạn không có quyền thực hiện lệnh này!"
  player-only: "&c✖ Lệnh này chỉ dành cho người chơi!"
  level-up: "&6&l✦ LEVEL UP! ✦ &r&7Bạn đã đạt cấp &e{level}&7! &a+{points} điểm tiềm năng"
  max-level: "&eBạn đã đạt cấp tối đa!"
  no-points: "&c✖ Bạn không có điểm tiềm năng!"
  stats-maxed: "&c✖ Chỉ số này đã đạt tối đa!"
  reset-success: "&a✔ Đã reset toàn bộ chỉ số! Hoàn trả &e{points}&a điểm."
  exp-gained: "&a+{exp} exp &7({current}/{needed})"
  player-not-found: "&c✖ Không tìm thấy người chơi!"
  invalid-number: "&c✖ Số không hợp lệ!"
  reload-success: "&a✔ Đã reload config!"
  stats-added: "&a✔ Đã cộng &e{amount}&a điểm vào &b{stat}"
  level-set: "&a✔ Đã set cấp của &e{player}&a thành &b{level}"
  level-added: "&a✔ Đã cộng &e{amount}&a cấp cho &e{player}"
  exp-added: "&a✔ Đã cộng &e{amount}&a exp cho &e{player}"
  reset-item-given: "&a✔ Đã nhận item reset!"

actionbar: "&b✦ Lv.{level} &8| &r{exp_bar} &7{current}/{needed} &8| &6💎 {points} điểm"

levelup-title:
  title: "&6&l✦ LEVEL UP ✦"
  subtitle: "&7Cấp &e{level} &8| &a+{points} điểm"
  fade-in: 10
  stay: 40
  fade-out: 10